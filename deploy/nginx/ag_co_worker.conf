# Эталонный server block для ag_co_worker.
#
# Использование:
#   sudo cp deploy/nginx/ag_co_worker.conf /etc/nginx/sites-available/
#   # В файле заменить <domain> и пути к сертификатам на реальные.
#   sudo ln -s /etc/nginx/sites-available/ag_co_worker.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Плейсхолдеры, которые НАДО поменять:
#   <domain>     → публичный домен (server_name) — например, partners.constrtodo.ru
#   <cert_dir>   → абсолютный путь к директории с fullchain.pem / privkey.pem.
#                  Примеры:
#                    certbot, имя совпадает с доменом: /etc/letsencrypt/live/ag.example.com
#                    certbot, wildcard:                /etc/letsencrypt/live/constrtodo.ru
#                    cert вне certbot (bind-mount):    /home/leonidl/certs

# HTTP → HTTPS
server {
    listen      80;
    listen [::]:80;
    server_name <domain>;

    # Разрешаем certbot-ACME challenge, всё остальное редиректим на https.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
# `http2` параметром в listen — совместимо с nginx 1.18+ (включая 1.24 на Ubuntu 22.04).
# На nginx >= 1.25 можно альтернативно использовать отдельную директиву `http2 on;`,
# но listen-параметр поддерживается всеми версиями, так что используем его.
server {
    listen      443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <domain>;

    # TLS
    ssl_certificate     <cert_dir>/fullchain.pem;
    ssl_certificate_key <cert_dir>/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Разумные заголовки безопасности
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Отдельные логи под этот проект (удобно делить с соседями по машине)
    access_log /var/log/nginx/ag_co_worker.access.log;
    error_log  /var/log/nginx/ag_co_worker.error.log warn;

    # POST /api/offers с большими расчётами может быть > 1 MB по дефолту
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:3008;

        # Стандартный набор проксируемых заголовков
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # http1.1 нужен для keep-alive и upgrade (пока не используется, но на будущее)
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Таймауты: каталог AllIsolationConstr на calc-сервисе может отвечать до ~35s (см. CALC_SERVICE_TIMEOUT_MS)
        proxy_connect_timeout 5s;
        proxy_send_timeout   60s;
        proxy_read_timeout   60s;

        # Cookies (httpOnly accessToken/refreshToken) проходят без модификаций — это ок.
    }
}
