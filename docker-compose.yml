services:
  postgres:
    image: postgres:16
    container_name: ag_co_worker_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ag_co_worker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - ag_co_worker_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ag_co_worker"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backend (Express + tsx watch) в контейнере. Слушает :3007.
  # Образ собирается из backend/Dockerfile (стадия dev): tsx + prisma CLI +
  # chromium для PDF. Исходники монтируются bind-mount'ом (hot-reload), а
  # node_modules и кэш Chromium — named volume'ы (инициализируются из образа,
  # чтобы не затирать linux-бинарники и не тащить хостовые macOS-сборки).
  backend:
    build:
      context: ./backend
      target: dev
    container_name: ag_co_worker_backend
    # Регенерируем Prisma Client (схема bind-монтируется → всегда актуальна; иначе
    # named-volume node_modules затеняет свежий клиент из образа и ловим
    # PrismaClientValidationError на новых полях), применяем миграции, затем tsx watch.
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run dev"
    environment:
      # hostname = имя сервиса postgres во внутренней docker-сети.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ag_co_worker?schema=public
      PORT: "3007"
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:5175,http://localhost:5176
      CALC_SERVICE_URL: https://dev3.constrtodo.ru:3005
      CALC_SERVICE_TIMEOUT_MS: "60000"
      AUTH_SERVICE_URL: http://host.docker.internal:3005
      ONEC_SERVICE_URL: http://host.docker.internal:3005
      # tsx watch использует chokidar — polling гарантирует ловлю изменений
      # в bind-mount на macOS/Windows (где fs-события иногда не доходят).
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3007:3007"
    volumes:
      - ./backend:/app
      - ag_co_worker_backend_node_modules:/app/node_modules
      - ag_co_worker_backend_puppeteer:/app/.cache/puppeteer
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend (vite dev server) в контейнере. Поднимается на http://localhost:5175.
  # Браузер ходит relative /api,/login,/auth (vite proxy). node_modules — в named volume
  # (не затираем хостовые macOS-бинарники; внутри ставятся linux-сборки rollup/esbuild).
  frontend:
    image: node:20-bookworm-slim
    container_name: ag_co_worker_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      BACKEND_PROXY_TARGET: http://backend:3007
      AUTH_PROXY_TARGET: http://host.docker.internal:3005
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5175:5175"
    volumes:
      - ./frontend:/app
      - ag_co_worker_frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  # Веб-UI для базы. Поднимается на http://localhost:8080.
  # Логин: System=PostgreSQL, Server=postgres, User=postgres, Password=postgres, DB=ag_co_worker.
  adminer:
    image: adminer:4
    container_name: ag_co_worker_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ag_co_worker_pg_data:
  ag_co_worker_frontend_node_modules:
  ag_co_worker_backend_node_modules:
  ag_co_worker_backend_puppeteer:
