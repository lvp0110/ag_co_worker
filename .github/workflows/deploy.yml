# Статический фронт → ветка gh-pages → https://lvp0110.github.io/ag_co_worker/
#
# Workflow сам переключает Pages на ветку gh-pages (иначе при Source=main
# GitHub отдаёт README вместо приложения).
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          # Только pathname — НЕ полный https://….github.io/…
          BASE_PATH: /ag_co_worker/
          # Pages → auth/calc напрямую (:3005). Логин с X-CSRF-Token: pages
          # отдаёт Bearer в JSON. Override: Settings → Variables → VITE_API_URL
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://dev3.constrtodo.ru:3005' }}
          # КП = POST /integration/onec/isolation/document (на :3005 нет /api/offers).
          VITE_ONEC_DOCUMENT_DIRECT: ${{ vars.VITE_ONEC_DOCUMENT_DIRECT || 'true' }}
          # Hash-роутер: /calc не бьётся в настоящий 404 GitHub Pages
          VITE_ROUTER_HASH: "true"
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
          publish_branch: gh-pages
          force_orphan: true

      - name: Point GitHub Pages at gh-pages (not main/README)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          AUTH=( -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" )
          BODY='{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          CODE=$(curl -sS -o /tmp/pages-resp.json -w "%{http_code}" -X PUT "${AUTH[@]}" "$API" -d "$BODY" || true)
          echo "PUT /pages → HTTP $CODE"
          cat /tmp/pages-resp.json || true
          if [[ "$CODE" == "404" ]]; then
            CODE=$(curl -sS -o /tmp/pages-resp.json -w "%{http_code}" -X POST "${AUTH[@]}" "$API" -d "$BODY" || true)
            echo "POST /pages → HTTP $CODE"
            cat /tmp/pages-resp.json || true
          fi
          if [[ "$CODE" != "200" && "$CODE" != "201" && "$CODE" != "204" ]]; then
            echo "::warning::Не удалось переключить Pages на gh-pages (нужны права admin)."
            echo "Сделайте вручную: Settings → Pages → Deploy from a branch → gh-pages / (root)"
          fi
