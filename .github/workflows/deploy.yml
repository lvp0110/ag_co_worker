# Статический фронт → GitHub Pages (https://lvp0110.github.io/ag_co_worker/)
#
# Один раз: Settings → Pages → Source = GitHub Actions
# (не Deploy from branch / main — иначе вместо приложения будет README).
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          # Только pathname репозитория — НЕ полный https://….github.io/…
          BASE_PATH: /ag_co_worker/
          # Опционально: публичный API (Settings → Variables → VITE_API_URL).
          # Иначе /api и /login уйдут на github.io и не сработают.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
