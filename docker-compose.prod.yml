# Прод-стек ag_co_worker на webtest (51.250.51.86), домен isocalc.constrtodo.ru.
#
#   Интернет :443 → host nginx → 127.0.0.1:3007 → [frontend]
#                                                      ↓
#                                    ConstrTodo: auth/calc/админ-API/1С
#                                    (dev3.constrtodo.ru:3005)
#
# В стеке один сервис: своего backend у проекта нет, frontend отдаёт статику и
# проксирует API в ConstrTodo. Публикуется только на loopback — TLS у хостового
# nginx.
#
# Секреты и внешние URL — в .env.prod рядом с этим файлом (chmod 600, не в git).
# Запуск:  docker compose -f docker-compose.prod.yml up -d --build

services:
  frontend:
    build:
      context: ./frontend
    image: ag_co_worker-frontend:latest
    container_name: ag_co_worker-frontend
    restart: unless-stopped
    env_file:
      # Нужен UPSTREAM_URL (историческое имя AUTH_SERVICE_URL тоже читается).
      # PORT из .env.prod перебивается ниже — environment приоритетнее env_file.
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: "3008"
      DIST_DIR: /app/dist
    ports:
      # Только loopback: снаружи ходит host nginx.
      - "127.0.0.1:3007:3008"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3008/__front_health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
