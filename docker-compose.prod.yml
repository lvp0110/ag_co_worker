# Production frontend на prodfront, домен isocalc.constrtodo.ru.
#
#   Интернет :443 → gateway-01 → 10.0.0.249:3011 → [frontend]
#                                                      ↓
#                                    ConstrTodo: auth/calc/админ-API/1С
#                                    (prodbackend.mcs.local:3005)
#
# В стеке один сервис: своего backend у проекта нет, frontend отдаёт статику и
# проксирует API в ConstrTodo. Публикуется только на приватном интерфейсе — TLS
# завершается на gateway-01.
#
# Секреты и внешние URL — в .env.prod рядом с этим файлом (chmod 600, не в git).
# Запуск:  docker compose -f docker-compose.prod.yml up -d --build

services:
  frontend:
    build:
      context: ./frontend
    image: ag_co_worker-frontend:latest
    container_name: ag_co_worker-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3008"
      DIST_DIR: /app/dist
      UPSTREAM_URL: ${UPSTREAM_URL:?UPSTREAM_URL must be set in .env.prod}
      PAGES_CORS_ORIGINS: ${PAGES_CORS_ORIGINS:-}
    ports:
      # Только приватный интерфейс prodfront; снаружи ходит gateway-01.
      - "${FRONTEND_BIND_IP:?FRONTEND_BIND_IP must be set in .env.prod}:${FRONTEND_HOST_PORT:-3011}:3008"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3008/__front_health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
